<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f0f4f8; }

/* MOBILE FIRST — no flex trap */
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 280px; background: #0d9488;
  transform: translateX(-105%);
  transition: transform 0.28s ease;
  z-index: 1000;
  overflow-y: auto;
}
html.sidebar-open #sidebar { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.3); }

#backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 999;
}
html.sidebar-open #backdrop { display: block; }

#mobile-header {
  position: sticky; top: 0; z-index: 100;
  background: white; border-bottom: 1px solid #e2e8f0;
  padding: 0 16px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}

/* Content just flows normally */
#content { padding: 16px; }

/* DESKTOP ONLY — apply the flex sidebar layout */
@media (min-width: 769px) {
  body { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { position: relative; transform: none; width: 260px; flex-shrink: 0; }
  #backdrop { display: none !important; }
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #mobile-header { display: none; }
}
</style>
</head>
<body>

<div id="sidebar">
  <div style="padding:20px;color:white">
    <h3>Sidebar</h3>
    <button onclick="closeSidebar()"
            style="background:white;border:none;padding:12px 16px;border-radius:8px;margin-top:16px;cursor:pointer;width:100%;font-size:16px">
      ✕ Close
    </button>
    <div style="margin-top:16px">
      <button onclick="alert('Nav 1!');closeSidebar();" style="display:block;width:100%;padding:14px;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;text-align:left;margin-bottom:8px;border-radius:8px;font-size:16px">Nav Item 1</button>
      <button onclick="alert('Nav 2!');closeSidebar();" style="display:block;width:100%;padding:14px;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;text-align:left;margin-bottom:8px;border-radius:8px;font-size:16px">Nav Item 2</button>
    </div>
  </div>
</div>

<div id="backdrop" onclick="closeSidebar()"></div>

<div id="main">
  <div id="mobile-header">
    <button onclick="openSidebar()"
            style="background:none;border:none;font-size:24px;cursor:pointer;padding:8px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center">
      ☰
    </button>
    <span style="font-weight:700;font-size:18px">MLT Test</span>
    <span style="width:48px"></span>
  </div>

  <div id="content">
    <h2 style="margin-bottom:16px;color:#0d9488">Touch Test</h2>

    <button onclick="alert('✅ Button 1 works!')"
            style="display:block;width:100%;padding:18px;background:#0d9488;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-bottom:12px;font-weight:700">
      Tap Me — Button 1
    </button>

    <button onclick="alert('✅ Button 2 works!')"
            style="display:block;width:100%;padding:18px;background:#7c3aed;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-bottom:12px;font-weight:700">
      Tap Me — Button 2
    </button>

    <input type="text" placeholder="Tap here — keyboard should open"
           style="display:block;width:100%;padding:16px;border:2px solid #0d9488;border-radius:10px;font-size:16px;margin-bottom:12px">

    <div style="background:linear-gradient(135deg,#0d9488,#7c3aed);border-radius:10px;padding:32px;text-align:center;color:white;font-size:18px;margin-bottom:12px">
      Scroll down ↓
    </div>
    <div style="height:200px;background:#f59e0b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px">
      Orange box — scroll to see this
    </div>
    <div style="height:200px;background:#dc2626;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:white;margin-bottom:12px">
      Red box — scroll more
    </div>
    <div style="height:80px"></div>
  </div>
</div>

<script>
function openSidebar()  { document.documentElement.classList.add('sidebar-open'); }
function closeSidebar() { document.documentElement.classList.remove('sidebar-open'); }
</script>
</body>
</html>
